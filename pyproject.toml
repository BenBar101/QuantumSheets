[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QuantumSheets"
dynamic = ["version"]
description = "Displaying quantum circuits with classical notes"
authors = [
    { name = "Ben Bar" }
]
dependencies = [
    "qiskit",
    "matplotlib",
    "numpy",
    "sympy",
]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[tool.setuptools.dynamic]
version = {attr = "QuantumSheets.__version__"}

[tool.setuptools.package-data]
QuantumSheets = ["*.png", "*.otf", "py.typed"]
